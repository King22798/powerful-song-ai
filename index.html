<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Powerful Song AI</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  min-height:100vh;
  background:linear-gradient(145deg,#080014,#18002f,#35005c);
  color:white;
  padding:18px
}

.container{max-width:680px;margin:auto}

.logo{
  text-align:center;
  font-size:30px;
  font-weight:900;
  margin:12px 0 6px;
  text-shadow:0 0 20px #b000ff
}

.subtitle{text-align:center;color:#ddd;margin-bottom:22px}

.card{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.18);
  border-radius:22px;
  padding:20px;
  backdrop-filter:blur(12px)
}

label{display:block;margin:14px 0 7px;font-weight:bold}

textarea,select{
  width:100%;
  border:0;
  outline:none;
  border-radius:13px;
  padding:14px;
  font-size:16px;
  background:#160d20;
  color:white
}

textarea{min-height:140px;resize:vertical}

button{
  width:100%;
  margin-top:20px;
  padding:16px;
  border:0;
  border-radius:15px;
  font-size:18px;
  font-weight:bold;
  color:white;
  background:linear-gradient(90deg,#7928ff,#d000ff);
  box-shadow:0 0 25px rgba(180,0,255,.45);
  cursor:pointer
}

button:disabled{opacity:.55;cursor:not-allowed}

.status{
  margin-top:18px;
  padding:15px;
  border-radius:14px;
  background:rgba(0,0,0,.35);
  line-height:1.6;
  display:none
}

.result{
  margin-top:18px;
  padding:18px;
  border-radius:18px;
  background:rgba(0,0,0,.35);
  display:none
}

.result h2{margin-bottom:12px}

audio{width:100%;margin-top:12px}

.download{
  display:block;
  text-align:center;
  margin-top:12px;
  padding:13px;
  border-radius:12px;
  background:#6d28d9;
  color:white;
  text-decoration:none;
  font-weight:bold
}

.small{
  font-size:12px;
  color:#aaa;
  margin-top:12px;
  line-height:1.5;
  text-align:center
}
</style>
</head>

<body>

<div class="container">

<div class="logo">🎵 POWERFUL SONG AI</div>

<div class="subtitle">
Create Your Own Powerful Original Song
</div>

<div class="card">

<label>🔥 Song Topic</label>

<textarea
id="topic"
placeholder="যেমন: কর্ণের শেষ প্রণাম, মহাদেব ভক্তি, 15 August, বিরহের গান..."
></textarea>

<label>🌐 Language</label>

<select id="language">
<option value="Hindi">Hindi</option>
<option value="Bengali">Bengali</option>
<option value="English">English</option>
</select>

<label>🎼 Music Style</label>

<select id="style">
<option value="Powerful Cinematic">Powerful Cinematic</option>
<option value="Epic Bollywood">Epic Bollywood</option>
<option value="Devotional Anthem">Devotional Anthem</option>
<option value="Sad Emotional">Sad Emotional</option>
<option value="Romantic">Romantic</option>
<option value="Powerful DJ">Powerful DJ</option>
<option value="Purulia Folk DJ">Purulia Folk DJ</option>
<option value="Patriotic Anthem">Patriotic Anthem</option>
<option value="Cinematic Rock">Cinematic Rock</option>
<option value="Rap">Rap</option>
</select>

<label>🎤 Vocal</label>

<select id="gender">
<option value="male">Powerful Male Vocal</option>
<option value="female">Powerful Female Vocal</option>
<option value="">Auto</option>
</select>

<label>🎹 Music Model</label>

<select id="model">
<option value="MFV3.0">MFV3.0</option>
<option value="MFV2.0">MFV2.0</option>
<option value="MFV1.5X">MFV1.5X</option>
<option value="MFV1.5">MFV1.5</option>
<option value="MFV1.0">MFV1.0</option>
</select>

<button id="generateBtn">
🔥 GENERATE POWERFUL SONG
</button>

<div id="status" class="status"></div>

<div id="result" class="result">

<h2>🎵 Your Song</h2>

<div id="songInfo"></div>

<audio id="audio" controls></audio>

<a
id="download"
class="download"
target="_blank"
rel="noopener"
>
⬇️ DOWNLOAD / OPEN MP3
</a>

</div>

<div class="small">
🔐 API key নিরাপদে Cloudflare Worker-এর Secret হিসেবে থাকবে।
Browser-এ API key দেখানো হবে না।
</div>

</div>
</div>

<script>

const topic=document.getElementById("topic");
const language=document.getElementById("language");
const style=document.getElementById("style");
const gender=document.getElementById("gender");
const model=document.getElementById("model");
const btn=document.getElementById("generateBtn");

const statusBox=document.getElementById("status");
const resultBox=document.getElementById("result");
const songInfo=document.getElementById("songInfo");
const audio=document.getElementById("audio");
const download=document.getElementById("download");

function status(message){
  statusBox.style.display="block";
  statusBox.innerHTML=message;
}

function escapeHtml(str){
  return String(str)
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

async function generateSong(){

  const subject=topic.value.trim();

  if(!subject){
    status("❌ আগে Song Topic লিখো।");
    return;
  }

  btn.disabled=true;
  resultBox.style.display="none";

  status("⏳ গান তৈরির request পাঠানো হচ্ছে...");

  try{

    const musicStyle=
      `${style.value}, ${language.value} song, `+
      `${gender.value || "auto"} vocal, `+
      `powerful original composition. Topic: ${subject}`;

    const body={
      action:"auto",
      style:musicStyle,
      mv:model.value,
      instrumental:0,
      gender:gender.value || ""
    };

    const response=await fetch("/api/generate",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify(body)
    });

    const text=await response.text();

    let data;

    try{
      data=JSON.parse(text);
    }catch(e){
      throw new Error(
        "Server থেকে সঠিক JSON response আসেনি: "+text
      );
    }

    if(!response.ok){
      throw new Error(
        data.message ||
        data.detail ||
        data.error ||
        "API Error "+response.status
      );
    }

    console.log("Generate Response:",data);

    const ids=extractTaskIds(data);
    const directAudio=findAudioUrl(data);

    if(directAudio){
      showSong(directAudio,data);
      status("✅ গান তৈরি হয়ে গেছে!");
      return;
    }

    if(ids.length===0){
      throw new Error(
        "Generation request হয়েছে, কিন্তু Task ID পাওয়া যায়নি।"
      );
    }

    status(
      "🎵 গান তৈরির কাজ শুরু হয়েছে।<br><br>"+
      "⏳ Musicful গান তৈরি করছে..."
    );

    await pollTasks(ids);

  }catch(error){

    console.error(error);

    status(
      "❌ সমস্যা হয়েছে।<br><br>"+
      escapeHtml(error.message)
    );

  }finally{

    btn.disabled=false;

  }
}

function extractTaskIds(data){

  const ids=[];

  function scan(obj){

    if(!obj || typeof obj!=="object") return;

    if(Array.isArray(obj)){
      obj.forEach(scan);
      return;
    }

    if(obj.id && typeof obj.id==="string"){
      ids.push(obj.id);
    }

    if(obj.task_id && typeof obj.task_id==="string"){
      ids.push(obj.task_id);
    }

    if(obj.taskId && typeof obj.taskId==="string"){
      ids.push(obj.taskId);
    }

    Object.keys(obj).forEach(key=>{
      if(obj[key] && typeof obj[key]==="object"){
        scan(obj[key]);
      }
    });
  }

  scan(data);

  return [...new Set(ids)];
}

function findAudioUrl(data){

  if(!data) return null;

  if(typeof data==="string"){

    if(
      data.startsWith("http") &&
      (
        data.includes(".mp3") ||
        data.includes(".wav") ||
        data.includes("audio")
      )
    ){
      return data;
    }

    return null;
  }

  if(Array.isArray(data)){

    for(const item of data){

      const url=findAudioUrl(item);

      if(url) return url;

    }
  }

  if(typeof data==="object"){

    const possible=[
      "audio_url",
      "audioUrl",
      "mp3_url",
      "download_url",
      "url"
    ];

    for(const key of possible){

      if(
        typeof data[key]==="string" &&
        data[key].startsWith("http")
      ){
        return data[key];
      }

    }

    for(const key of Object.keys(data)){

      if(
        data[key] &&
        typeof data[key]==="object"
      ){

        const url=findAudioUrl(data[key]);

        if(url) return url;

      }

    }
  }

  return null;
}

async function pollTasks(ids){

  for(let attempt=1;attempt<=80;attempt++){

    await new Promise(
      resolve=>setTimeout(resolve,7000)
    );

    status(
      "🎼 গান তৈরি হচ্ছে...<br>"+
      "⏳ Checking: "+attempt+"/80"
    );

    const response=await fetch(
      "/api/tasks?ids="+
      encodeURIComponent(ids.join(","))
    );

    const text=await response.text();

    let data;

    try{
      data=JSON.parse(text);
    }catch(e){
