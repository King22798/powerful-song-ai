<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Powerful Song AI</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  min-height:100vh;
  background:linear-gradient(145deg,#08000f,#1b0035,#05000b);
  color:white;
  padding:18px;
}

.container{
  max-width:650px;
  margin:auto;
}

.logo{
  text-align:center;
  font-size:30px;
  font-weight:900;
  margin:18px 0 6px;
  text-shadow:0 0 25px #b000ff;
}

.subtitle{
  text-align:center;
  color:#bbb;
  margin-bottom:22px;
}

.card{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
  border-radius:22px;
  padding:20px;
  backdrop-filter:blur(12px);
}

label{
  display:block;
  margin:14px 0 7px;
  font-weight:bold;
}

textarea,select{
  width:100%;
  border:0;
  outline:none;
  border-radius:13px;
  padding:14px;
  font-size:16px;
  background:#160e20;
  color:white;
}

textarea{
  min-height:150px;
  resize:vertical;
}

button{
  width:100%;
  margin-top:20px;
  padding:16px;
  border:0;
  border-radius:15px;
  font-size:17px;
  font-weight:bold;
  color:white;
  background:linear-gradient(90deg,#7928ff,#d000ff);
  box-shadow:0 0 25px rgba(180,0,255,.45);
}

button:disabled{
  opacity:.6;
}

.status{
  margin-top:18px;
  padding:15px;
  border-radius:14px;
  background:rgba(0,0,0,.35);
  line-height:1.6;
  display:none;
}

audio{
  width:100%;
  margin-top:15px;
  display:none;
}

.footer{
  text-align:center;
  color:#777;
  margin-top:22px;
  font-size:12px;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">🎵 POWERFUL SONG AI</div>

  <div class="subtitle">
    Create Your Own Powerful Original Song
  </div>

  <div class="card">

    <label>🔥 Song Topic</label>

    <textarea id="topic"
      placeholder="Example: Karna's Last Prayer"></textarea>

    <label>🌐 Language</label>

    <select id="language">
      <option>Hindi</option>
      <option>Bengali</option>
      <option>English</option>
    </select>

    <label>🎼 Music Style</label>

    <select id="style">
      <option>Powerful Cinematic</option>
      <option>Epic Indian</option>
      <option>Powerful Bollywood</option>
      <option>Devotional</option>
      <option>Mahadev Bhakti</option>
      <option>Patriotic</option>
      <option>Sad Emotional</option>
      <option>Romantic</option>
      <option>Purulia DJ</option>
      <option>Desi DJ</option>
    </select>

    <label>⏱️ Duration</label>

    <select id="duration">
      <option value="30">30 Seconds Test</option>
      <option value="60">1 Minute</option>
      <option value="90">1.5 Minutes</option>
      <option value="120">2 Minutes</option>
      <option value="180">3 Minutes</option>
    </select>

    <button id="generate" onclick="generateSong()">
      🔥 GENERATE POWERFUL SONG
    </button>

    <div class="status" id="status"></div>

    <audio id="audio" controls></audio>

  </div>

  <div class="footer">
    Powerful Song AI • Original Music Creation
  </div>

</div>


<script type="module">

import { Client } from
"https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";


/*
  HeartMuLa public Space
*/
const SPACE = "projectlosangeles/HeartMuLa";


function buildLyrics(topic, language){

  if(language === "Hindi"){

    return `[Intro]
तेरी कहानी आज फिर गूंजे,
दिल के अंदर आग जले।

[Verse]
${topic} की ये कहानी,
दर्द भी है, शान भी।
जो मिट गया देश के लिए,
उसकी अमर पहचान भी।

[Prechorus]
आंधियां चाहे कितनी आएं,
हौसला हमारा ना झुके।

[Chorus]
तेरा नाम अमर रहेगा,
तेरी बात अमर रहे।
जब तक ये दुनिया जिंदा है,
तेरा जज्बा जिंदा रहे।

[Verse]
रास्ते कठिन थे फिर भी,
कदम कभी पीछे ना हुए।
जिसने अपना सब कुछ दे दिया,
उसके सपने अधूरे ना हुए।

[Bridge]
आज भी दिल पुकारे,
तेरी गाथा कौन भुलाए।

[Chorus]
तेरा नाम अमर रहेगा,
तेरी बात अमर रहे।
जब तक ये दुनिया जिंदा है,
तेरा जज्बा जिंदा रहे।

[Outro]
तेरी कहानी खत्म नहीं,
हर दिल में तू जिंदा रहे।`;

  }

  if(language === "Bengali"){

    return `[Intro]
তোর গল্প আজও জাগে,
হৃদয়ের গভীরে।

[Verse]
${topic} এর সেই কাহিনি,
ব্যথা আছে, গর্বও আছে।
যে দিয়েছে নিজের সব,
তার নাম হৃদয়ে বাঁচে।

[Prechorus]
ঝড় এলেও পথ থামবে না,
আগুন হলেও মন হারবে না।

[Chorus]
তোর নাম অমর থাকবে,
তোর কথা অমর রবে।
যতদিন এই পৃথিবী আছে,
তোর সাহস বেঁচে রবে।

[Verse]
কঠিন পথে চলেছিলি,
পিছিয়ে কখনও যাসনি।
নিজের জীবন দিয়ে তুই,
স্বপ্নগুলো হারাসনি।

[Bridge]
আজও তোকে মনে পড়ে,
গল্প তোরই সবাই গড়ে।

[Chorus]
তোর নাম অমর থাকবে,
তোর কথা অমর রবে।
যতদিন এই পৃথিবী আছে,
তোর সাহস বেঁচে রবে।

[Outro]
তোর গল্প শেষ নয়,
প্রতিটি মনে বেঁচে রয়।`;

  }

  return `[Intro]
Your story still remains,
Burning through the night.

[Verse]
${topic} is the story,
Of courage and of pain.
Those who gave their everything,
Will never fade again.

[Prechorus]
Let the storm come,
Let the darkness rise.

[Chorus]
Your name will live forever,
Your fire will never fade.
As long as hearts are beating,
Your memory will remain.

[Verse]
Every road was difficult,
But you never turned away.
You gave everything you had,
To light another day.

[Bridge]
Your story still is calling,
Your courage still is here.

[Chorus]
Your name will live forever,
Your fire will never fade.
As long as hearts are beating,
Your memory will remain.

[Outro]
The story never ends,
You live within our hearts.`;
}


function buildTags(style){

  const styles = {

    "Powerful Cinematic":
    "male,cinematic,epic,emotional,powerful,orchestral,drums,Strings,bass",

    "Epic Indian":
    "male,epic,Indian,cinematic,powerful,drums,Strings,bass",

    "Powerful Bollywood":
    "male,Bollywood,powerful,emotional,drums,Strings,piano",

    "Devotional":
    "male,devotional,emotional,faith,powerful,Strings,drums",

    "Mahadev Bhakti":
    "male,devotional,epic,powerful,faith,drums,Strings,bass",

    "Patriotic":
    "male,patriotic,epic,powerful,emotional,drums,Strings,bass",

    "Sad Emotional":
    "male,Ballad,Sad,emotional,piano,Strings,Longing",

    "Romantic":
    "male,Romantic,emotional,piano,acoustic guitar,Strings",

    "Purulia DJ":
    "male,electronic,driving,energetic,drum machine,bass,synthesizer",

    "Desi DJ":
    "male,electronic,energetic,drum machine,bass,synthesizer,pop"

  };

  return styles[style] ||
    "male,cinematic,powerful,emotional,drums,Strings";
}


async function generateSong(){

  const topic =
    document.getElementById("topic").value.trim();

  const language =
    document.getElementById("language").value;

  const style =
    document.getElementById("style").value;

  const duration =
    Number(document.getElementById("duration").value);

  const button =
    document.getElementById("generate");

  const status =
    document.getElementById("status");

  const audio =
    document.getElementById("audio");


  if(!topic){

    alert("আগে Song Topic লিখো।");

    return;
  }


  button.disabled=true;

  status.style.display="block";

  status.innerHTML =
    "⏳ AI Music Engine connecting...";


  audio.style.display="none";

  try{

    status.innerHTML =
      "🔌 HeartMuLa Music Engine-এর সঙ্গে কানেক্ট হচ্ছে...";


    const app =
      await Client.connect(SPACE);


    status.innerHTML =
      "🎼 Lyrics + Music Style পাঠানো হচ্ছে...";


    const lyrics =
      buildLyrics(topic,language);

    const tags =
      buildTags(style);


    /*
      IMPORTANT:
      HeartMuLa API endpoint/input order
      may change with the Space version.
    */

    const api =
      await app.view_api();


    console.log("HeartMuLa API:",api);


    status.innerHTML =
      "🎵 Music generation শুরু হয়েছে...<br>" +
      "এখন queue-তে থাকলে একটু সময় লাগতে পারে।";


    /*
      Try the common HeartMuLa endpoint.
    */

    const result =
      await app.predict("/generate_music",[
        lyrics,
        tags,
        duration,
        1.0,
        50,
        1.5
      ]);


    console.log("Result:",result);


    let output = null;


    if(result && result.data){

      for(const item of result.data){

        if(typeof item === "string" &&
           (item.endsWith(".mp3") ||
            item.endsWith(".wav") ||
            item.includes("audio"))){

          output=item;
          break;
        }

        if(item && typeof item === "object"){

          if(item.url){

            output=item.url;
            break;

          }

          if(item.path){

            output=item.path;
            break;

          }

        }

      }

    }


    if(output){

      audio.src=output;

      audio.style.display="block";

      status.innerHTML =
        "✅ গান তৈরি হয়েছে!<br>" +
        "▶️ নিচের Play বাটনে চাপো।";

    }else{

      status.innerHTML =
        "⚠️ Music engine response এসেছে, কিন্তু audio URL পাওয়া যায়নি।<br><br>" +
        "API response console-এ দেখা যাবে।";

    }


  }catch(error){

    console.error(error);

    status.innerHTML =
      "❌ Music generation এখন সম্পূর্ণ হয়নি।<br><br>" +
      "HeartMuLa Space-এর API endpoint/version পরিবর্তিত হলে এই error হতে পারে।<br><br>" +
      "Error: " + error.message;

  }


  button.disabled=false;

}

</script>

</body>
</html>
